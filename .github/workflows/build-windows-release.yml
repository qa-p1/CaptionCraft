name: Build Windows release

on:
  push:
    branches:
      - "release-readiness-*"
    paths:
      - "lib/**"
      - "windows/**"
      - "test/**"
      - "assets/**"
      - "captioncraft_logo.svg"
      - ".env.example"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Flutter 3.41.2 / Windows x64
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      FIREBASE_CPP_SDK_ARCHIVE: firebase_cpp_sdk_windows_13.4.0.zip
      FIREBASE_CPP_SDK_BYTES: "957334242"
      FIREBASE_CPP_SDK_SHA256: acc415e7a50d80f8456ce8abd8eb2e1a6f0739517b3939a1b1feb66d865b0be8
      FIREBASE_CPP_SDK_URL: https://dl.google.com/firebase/sdk/cpp/firebase_cpp_sdk_windows_13.4.0.zip
      FIREBASE_CPP_SDK_VERSION: 13.4.0
      FFMPEGKIT_ARCHIVE: ffmpeg-kit-windows-x86_64-full-gpl-8.1.2.zip
      FFMPEGKIT_SHA256: 83d67fec21e569c8e8177b3c7ac7d7579785582672b6ee3cab72fbec320b4215
      FFMPEGKIT_URL: https://github.com/sk3llo/ffmpeg_kit_flutter/releases/download/8.1.2-full-gpl/ffmpeg-kit-windows-x86_64-full-gpl-8.1.2.zip

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Install pinned NuGet CLI
        uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2
        with:
          nuget-version: "7.9.0"

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Restore locked Dart packages
        run: flutter pub get --enforce-lockfile

      - name: Resolve release identity
        shell: pwsh
        run: |
          $versionMatch = Select-String `
            -Path "pubspec.yaml" `
            -Pattern '^\s*version:\s*(\d+\.\d+\.\d+\+\d+)\s*$'
          if ($versionMatch.Matches.Count -ne 1) {
            throw "pubspec.yaml does not contain one valid release version."
          }
          $buildVersion = $versionMatch.Matches[0].Groups[1].Value
          $releaseVersion = "v$($buildVersion.Split('+')[0])"
          "CAPTIONCRAFT_BUILD_VERSION=$buildVersion" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAPTIONCRAFT_RELEASE_VERSION=$releaseVersion" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare verified Firebase C++ SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP $env:FIREBASE_CPP_SDK_ARCHIVE
          $extractRoot = Join-Path $env:RUNNER_TEMP "captioncraft-firebase-cpp"

          & curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-all-errors `
            --connect-timeout 30 `
            --max-time 1800 `
            --output $archive `
            $env:FIREBASE_CPP_SDK_URL
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the pinned Firebase C++ SDK archive."
          }

          $actualBytes = (Get-Item -LiteralPath $archive).Length
          if ($actualBytes -ne [long]$env:FIREBASE_CPP_SDK_BYTES) {
            throw "Firebase SDK size mismatch. Expected $env:FIREBASE_CPP_SDK_BYTES bytes, received $actualBytes."
          }
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:FIREBASE_CPP_SDK_SHA256) {
            throw "Firebase SDK checksum mismatch. Expected $env:FIREBASE_CPP_SDK_SHA256, received $actualHash."
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force
          $sdkDir = Join-Path $extractRoot "firebase_cpp_sdk_windows"
          $versionHeader = Join-Path $sdkDir "include/firebase/version.h"
          if (-not (Test-Path -LiteralPath $versionHeader -PathType Leaf)) {
            throw "The verified Firebase SDK archive is missing include/firebase/version.h."
          }
          $versionText = Get-Content -LiteralPath $versionHeader -Raw
          foreach ($definition in @(
            "#define FIREBASE_VERSION_MAJOR 13",
            "#define FIREBASE_VERSION_MINOR 4",
            "#define FIREBASE_VERSION_REVISION 0"
          )) {
            if (-not $versionText.Contains($definition)) {
              throw "The Firebase SDK header does not identify version $env:FIREBASE_CPP_SDK_VERSION."
            }
          }
          Remove-Item -LiteralPath $archive -Force
          "FIREBASE_CPP_SDK_DIR=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare verified Windows FFmpeg runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP $env:FFMPEGKIT_ARCHIVE
          $extractRoot = Join-Path $env:RUNNER_TEMP "captioncraft-ffmpegkit"
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null

          & curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-all-errors `
            --connect-timeout 30 `
            --max-time 600 `
            --output $archive `
            $env:FFMPEGKIT_URL
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the pinned Windows FFmpegKit archive."
          }

          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:FFMPEGKIT_SHA256) {
            throw "FFmpegKit checksum mismatch. Expected $env:FFMPEGKIT_SHA256, received $actualHash."
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force
          $libraries = @(
            Get-ChildItem -LiteralPath $extractRoot -Recurse -File -Filter "libffmpegkit.dll"
          )
          if ($libraries.Count -ne 1) {
            throw "Expected one libffmpegkit.dll in the verified archive; found $($libraries.Count)."
          }

          $bundleDir = Split-Path -Parent $libraries[0].Directory.FullName
          if (-not (Test-Path -LiteralPath (Join-Path $bundleDir "include/FFmpegKit.h") -PathType Leaf)) {
            throw "The verified FFmpegKit archive is missing its public headers."
          }
          Remove-Item -LiteralPath $archive -Force
          "FFMPEGKIT_LOCAL_DIR=$bundleDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Windows release services
        shell: pwsh
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CAPTIONCRAFT_ASSET_MANIFEST_URL: ${{ vars.CAPTIONCRAFT_ASSET_MANIFEST_URL }}
        run: |
          $configuration = [ordered]@{
            GIPHY_API_KEY = $env:GIPHY_API_KEY
            PEXELS_API_KEY = $env:PEXELS_API_KEY
            PIXABAY_API_KEY = $env:PIXABAY_API_KEY
            CAPTIONCRAFT_ASSET_MANIFEST_URL = $env:CAPTIONCRAFT_ASSET_MANIFEST_URL
          }
          $missing = @(
            $configuration.GetEnumerator() |
              Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } |
              ForEach-Object Key
          )
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions release configuration: $($missing -join ', ')."
          }

          $defineFile = Join-Path $env:RUNNER_TEMP "captioncraft-windows.env"
          @(
            $configuration.GetEnumerator() |
              ForEach-Object { "$($_.Key)=$($_.Value)" }
          ) | Set-Content -LiteralPath $defineFile -Encoding utf8NoBOM
          "CAPTIONCRAFT_DEFINE_FILE=$defineFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Analyze Windows source
        run: flutter analyze

      - name: Run desktop regression tests
        run: >-
          flutter test
          test/app_startup_failure_test.dart
          test/editor_shortcuts_test.dart
          test/export_dialog_platform_test.dart
          test/export_storage_preflight_test.dart
          test/playback_provider_test.dart

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release --dart-define-from-file="$env:CAPTIONCRAFT_DEFINE_FILE"

      - name: Verify release bundle
        shell: pwsh
        run: |
          $releaseDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $executable = Join-Path $releaseDir "caption_craft.exe"
          $requiredPaths = @(
            $executable,
            (Join-Path $releaseDir "flutter_windows.dll"),
            (Join-Path $releaseDir "ffmpeg_kit_flutter_new_plugin.dll"),
            (Join-Path $releaseDir "libffmpegkit.dll"),
            (Join-Path $releaseDir "data/icudtl.dat"),
            (Join-Path $releaseDir "data/app.so")
          )
          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Windows release runtime is incomplete: $requiredPath is missing."
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $releaseDir "data/flutter_assets") -PathType Container)) {
            throw "Flutter assets are missing from the Windows release bundle."
          }
          $executableVersion = (Get-Item -LiteralPath $executable).VersionInfo.ProductVersion
          if ($executableVersion -ne $env:CAPTIONCRAFT_BUILD_VERSION) {
            throw "Windows executable version $executableVersion does not match $env:CAPTIONCRAFT_BUILD_VERSION."
          }

          [ordered]@{
            product = "CaptionCraft"
            version = $env:CAPTIONCRAFT_BUILD_VERSION
            release = $env:CAPTIONCRAFT_RELEASE_VERSION
            platform = "windows-x64"
            sourceCommit = $env:GITHUB_SHA
            flutter = "3.41.2"
            firebaseCppSdkArchiveSha256 = $env:FIREBASE_CPP_SDK_SHA256
            ffmpegKitArchiveSha256 = $env:FFMPEGKIT_SHA256
            builtAtUtc = [DateTime]::UtcNow.ToString("o")
          } | ConvertTo-Json | Set-Content `
            -LiteralPath (Join-Path $releaseDir "BUILD-INFO.json") `
            -Encoding utf8NoBOM

      - name: Smoke-test Windows executable startup
        shell: pwsh
        run: |
          $releaseDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $executable = Join-Path $releaseDir "caption_craft.exe"
          $process = Start-Process `
            -FilePath $executable `
            -WorkingDirectory $releaseDir `
            -WindowStyle Hidden `
            -PassThru
          try {
            if ($process.WaitForExit(12000)) {
              throw "CaptionCraft exited during the startup smoke test (exit code $($process.ExitCode))."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Package Windows release with checksum
        shell: pwsh
        run: |
          $releaseDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $archiveName = "CaptionCraft-$env:CAPTIONCRAFT_RELEASE_VERSION-Windows-x64.zip"
          $archive = Join-Path $env:GITHUB_WORKSPACE $archiveName
          & tar.exe -a -c -f $archive -C $releaseDir .
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Windows release archive creation failed."
          }
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash *$archiveName" | Set-Content `
            -LiteralPath "$archive.sha256" `
            -Encoding ascii `
            -NoNewline

      - name: Upload Windows release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CaptionCraft-${{ env.CAPTIONCRAFT_RELEASE_VERSION }}-Windows-x64
          path: |
            CaptionCraft-${{ env.CAPTIONCRAFT_RELEASE_VERSION }}-Windows-x64.zip
            CaptionCraft-${{ env.CAPTIONCRAFT_RELEASE_VERSION }}-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove temporary release configuration
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CAPTIONCRAFT_DEFINE_FILE)) {
            Remove-Item -LiteralPath $env:CAPTIONCRAFT_DEFINE_FILE -Force -ErrorAction SilentlyContinue
          }
