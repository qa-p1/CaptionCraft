name: Build unsigned iOS IPA

on:
  push:
    branches:
      - "release-readiness-*"
    paths:
      - "lib/**"
      - "ios/**"
      - "assets/**"
      - "captioncraft_logo.svg"
      - ".env.example"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-ios-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Flutter 3.41.2 / iOS 15+
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Record build toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Restore locked Dart packages
        run: flutter pub get --enforce-lockfile

      - name: Resolve release identity
        shell: bash
        run: |
          set -euo pipefail
          build_version="$(sed -nE 's/^[[:space:]]*version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml)"
          if [[ ! "$build_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::pubspec.yaml has an invalid release version: $build_version"
            exit 1
          fi
          release_version="v${build_version%%+*}"
          echo "CAPTIONCRAFT_BUILD_VERSION=$build_version" >> "$GITHUB_ENV"
          echo "CAPTIONCRAFT_RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Build unsigned iPhone application
        shell: bash
        env:
          CAPTIONCRAFT_TRANSCRIPTION_PROXY_URL: ${{ vars.CAPTIONCRAFT_TRANSCRIPTION_PROXY_URL }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CAPTIONCRAFT_ASSET_MANIFEST_URL: ${{ vars.CAPTIONCRAFT_ASSET_MANIFEST_URL }}
        run: |
          set -euo pipefail

          required_values=(
            CAPTIONCRAFT_TRANSCRIPTION_PROXY_URL
            GIPHY_API_KEY
            PEXELS_API_KEY
            PIXABAY_API_KEY
            CAPTIONCRAFT_ASSET_MANIFEST_URL
          )
          missing_values=false
          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name:-}" ]]; then
              echo "::error::Missing GitHub Actions configuration: $value_name"
              missing_values=true
            fi
          done
          if [[ "$missing_values" == true ]]; then
            exit 1
          fi

          define_file="$RUNNER_TEMP/captioncraft.env"
          trap 'rm -f "$define_file"' EXIT
          umask 077
          printf '%s\n' \
            "CAPTIONCRAFT_TRANSCRIPTION_PROXY_URL=$CAPTIONCRAFT_TRANSCRIPTION_PROXY_URL" \
            "GIPHY_API_KEY=$GIPHY_API_KEY" \
            "PEXELS_API_KEY=$PEXELS_API_KEY" \
            "PIXABAY_API_KEY=$PIXABAY_API_KEY" \
            "CAPTIONCRAFT_ASSET_MANIFEST_URL=$CAPTIONCRAFT_ASSET_MANIFEST_URL" \
            > "$define_file"

          flutter build ios \
            --release \
            --no-codesign \
            --dart-define-from-file="$define_file"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          test -s ios/Podfile.lock

          ipa_root="$RUNNER_TEMP/captioncraft-ipa"
          mkdir -p "$ipa_root/Payload"
          ditto build/ios/iphoneos/Runner.app "$ipa_root/Payload/Runner.app"
          cd "$ipa_root"
          ipa_name="CaptionCraft-${CAPTIONCRAFT_RELEASE_VERSION}-iOS-unsigned.ipa"
          ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/$ipa_name"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "$ipa_name" > "$ipa_name.sha256"

      - name: Upload IPA and resolved pods
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CaptionCraft-${{ env.CAPTIONCRAFT_RELEASE_VERSION }}-iOS-unsigned
          path: |
            CaptionCraft-${{ env.CAPTIONCRAFT_RELEASE_VERSION }}-iOS-unsigned.ipa
            CaptionCraft-${{ env.CAPTIONCRAFT_RELEASE_VERSION }}-iOS-unsigned.ipa.sha256
            ios/Podfile.lock
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
