name: Validate CaptionCraft

on:
  push:
    branches:
      - editor-heavy-project-foundation
      - "release-readiness-*"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/editor-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test / Flutter 3.41.2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Restore locked Dart packages
        run: flutter pub get --enforce-lockfile

      - name: Install media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Upload golden failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-failures-linux
          path: test/failures/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate Android application packaging
        if: ${{ always() }}
        run: flutter build apk --debug
