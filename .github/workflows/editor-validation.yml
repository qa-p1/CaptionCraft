name: Validate CaptionCraft

on:
  push:
    branches:
      - editor-heavy-project-foundation
      - "release-readiness-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test / Flutter 3.41.2
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Restore locked Dart packages
        run: flutter pub get --enforce-lockfile

      - name: Install media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Upload golden failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-test-failures-linux
          path: test/failures/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate Android application packaging
        if: ${{ always() }}
        run: flutter build apk --debug
