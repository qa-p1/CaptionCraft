name: Build signed Android release

on:
  push:
    branches:
      - "release-readiness-*"
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "captioncraft_logo.svg"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Flutter 3.41.2 / signed Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Restore locked Dart packages
        run: flutter pub get --enforce-lockfile

      - name: Resolve release identity
        shell: bash
        run: |
          set -euo pipefail
          build_version="$(sed -nE 's/^[[:space:]]*version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml)"
          if [[ ! "$build_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::pubspec.yaml has an invalid release version: $build_version"
            exit 1
          fi
          release_version="v${build_version%%+*}"
          echo "CAPTIONCRAFT_BUILD_VERSION=$build_version" >> "$GITHUB_ENV"
          echo "CAPTIONCRAFT_RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Configure release inputs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required_values=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          missing_values=false
          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name:-}" ]]; then
              echo "::error::Missing GitHub Actions configuration: $value_name"
              missing_values=true
            fi
          done
          if [[ "$missing_values" == true ]]; then
            exit 1
          fi

          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed app bundle and APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --release
          flutter build apk --release --split-per-abi

      - name: Verify signed outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/bundle/release/app-release.aab
          compgen -G 'build/app/outputs/flutter-apk/app-*-release.apk' >/dev/null
          # Android upload certificates are normally self-signed. `-strict`
          # turns that expected certificate-chain warning into exit code 4,
          # so use jarsigner's cryptographic verification for the AAB and the
          # Android SDK verifier for every installable APK.
          aab_verification="$RUNNER_TEMP/captioncraft-aab-verification.txt"
          jarsigner -verify -verbose -certs \
            build/app/outputs/bundle/release/app-release.aab \
            >"$aab_verification" 2>&1
          cat "$aab_verification"
          if ! grep -Fq 'jar verified.' "$aab_verification"; then
            echo '::error::The Android App Bundle does not contain a verified JAR signature.'
            exit 1
          fi
          if grep -Fqi 'jar is unsigned' "$aab_verification"; then
            echo '::error::The Android App Bundle is unsigned.'
            exit 1
          fi
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print0 | sort -zV | tail -z -n 1 | tr -d '\0')"
          test -x "$apksigner_path"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$apksigner_path" verify --verbose --print-certs "$apk"
          done

      - name: Stage versioned Android release
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/captioncraft-android-release"
          mkdir -p "$release_dir"
          cp build/app/outputs/bundle/release/app-release.aab \
            "$release_dir/CaptionCraft-${CAPTIONCRAFT_RELEASE_VERSION}-Android.aab"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')"
            cp "$apk" \
              "$release_dir/CaptionCraft-${CAPTIONCRAFT_RELEASE_VERSION}-Android-${abi}.apk"
          done
          (
            cd "$release_dir"
            sha256sum -- *.aab *.apk > SHA256SUMS.txt
          )
          echo "CAPTIONCRAFT_ANDROID_RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"

      - name: Upload Android release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CaptionCraft-${{ env.CAPTIONCRAFT_RELEASE_VERSION }}-Android
          path: ${{ env.CAPTIONCRAFT_ANDROID_RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/upload-keystore.jks android/key.properties
