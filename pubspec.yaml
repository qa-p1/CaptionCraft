  name: caption_craft
  description: "CaptionCraft — AI-powered subtitle editor"
  publish_to: 'none'
  version: 0.1.1+2005

  environment:
    sdk: ^3.11.0

  dependencies:
    flutter:
      sdk: flutter

    # Video playback
    video_player: ^2.8.7
    chewie: ^1.7.5

    # Subtitle display overlay
    subtitle_wrapper_package: ^2.1.0

    # Subtitle data model & SRT/VTT parsing
    flutter_subtitle: ^0.0.6
    # FFmpeg for audio extraction, compression, video export
    ffmpeg_kit_flutter_new: ^4.1.0

    # File picking and local configuration
    file_picker: ^10.3.10
    flutter_dotenv: ^6.0.0

    # Secure local storage
    flutter_secure_storage: ^10.0.0

    # Firebase
    firebase_core: ^4.5.0
    firebase_auth: ^6.2.0
    cloud_firestore: ^6.1.3
    firebase_app_check: ^0.4.1+5

    # State management
    flutter_riverpod: ^2.5.1

    # Progress & UI
    percent_indicator: ^4.2.3
    shimmer: ^3.0.0

    # Media saving / export to gallery
    gal: ^2.3.0
    open_filex: ^4.6.0

    # Path helpers
    path_provider: ^2.1.3
    path: ^1.9.0

    # UUID
    uuid: ^4.4.0

    # HTTP for Groq API calls
    dio: ^5.4.3+1

    # In-editor Discover browser and bounded DOM media extraction
    flutter_inappwebview: ^6.1.5

    # User-initiated YouTube inspection and stream downloads
    youtube_explode_dart: ^3.1.0

    # Validate downloaded payloads independently of untrusted URL extensions
    mime: ^2.0.0

    # Provider attribution/source links in the Elements library
    url_launcher: ^6.3.2

    # Color picker
    flutter_colorpicker: ^1.1.0

    # Google Sign-In
    google_sign_in: ^7.2.0

    # Crypto for device fingerprint hashing
    crypto: ^3.0.3

    # Streaming ZIP extraction for optional, user-downloaded asset packs
    archive: ^4.0.9

  dev_dependencies:
    flutter_test:
      sdk: flutter
    flutter_lints: ^6.0.0

  flutter:
    uses-material-design: true
    assets:
      - .env.example
      - assets/fonts/licenses/
    fonts:
      - family: Roboto
        fonts:
          - asset: assets/fonts/Roboto-Variable.ttf
            weight: 400
          - asset: assets/fonts/Roboto-Variable.ttf
            weight: 700
          - asset: assets/fonts/Roboto-Italic-Variable.ttf
            weight: 400
            style: italic
          - asset: assets/fonts/Roboto-Italic-Variable.ttf
            weight: 700
            style: italic
      - family: Inter
        fonts:
          - asset: assets/fonts/Inter-Variable.ttf
            weight: 400
          - asset: assets/fonts/Inter-Variable.ttf
            weight: 700
          - asset: assets/fonts/Inter-Italic-Variable.ttf
            weight: 400
            style: italic
          - asset: assets/fonts/Inter-Italic-Variable.ttf
            weight: 700
            style: italic
      - family: Poppins
        fonts:
          - asset: assets/fonts/Poppins-Regular.ttf
            weight: 400
          - asset: assets/fonts/Poppins-Bold.ttf
            weight: 700
          - asset: assets/fonts/Poppins-Italic.ttf
            weight: 400
            style: italic
          - asset: assets/fonts/Poppins-BoldItalic.ttf
            weight: 700
            style: italic
      - family: Montserrat
        fonts:
          - asset: assets/fonts/Montserrat-Variable.ttf
            weight: 400
          - asset: assets/fonts/Montserrat-Variable.ttf
            weight: 700
          - asset: assets/fonts/Montserrat-Italic-Variable.ttf
            weight: 400
            style: italic
          - asset: assets/fonts/Montserrat-Italic-Variable.ttf
            weight: 700
            style: italic
      - family: Playfair Display
        fonts:
          - asset: assets/fonts/PlayfairDisplay-Variable.ttf
            weight: 400
          - asset: assets/fonts/PlayfairDisplay-Variable.ttf
            weight: 700
          - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
            weight: 400
            style: italic
          - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
            weight: 700
            style: italic
      - family: Space Mono
        fonts:
          - asset: assets/fonts/SpaceMono-Regular.ttf
            weight: 400
          - asset: assets/fonts/SpaceMono-Bold.ttf
            weight: 700
          - asset: assets/fonts/SpaceMono-Italic.ttf
            weight: 400
            style: italic
          - asset: assets/fonts/SpaceMono-BoldItalic.ttf
            weight: 700
            style: italic
