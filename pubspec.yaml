  name: caption_craft
  description: "CaptionCraft — AI-powered subtitle editor"
  publish_to: 'none'
  version: 0.1.0+1

  environment:
    sdk: ^3.11.0

  dependencies:
    flutter:
      sdk: flutter

    # Video playback
    video_player: ^2.8.7
    chewie: ^1.7.5

    # Subtitle display overlay
    subtitle_wrapper_package: ^2.1.0

    # Subtitle data model & SRT/VTT parsing
    flutter_subtitle: ^0.0.6
    ffmpeg_kit_flutter_new: ^4.1.0
    # FFmpeg for audio extraction, compression, video export

    # File picking
    file_picker: ^10.3.10
    flutter_dotenv: ^6.0.0
    # Device identity
    device_info_plus: ^12.3.0

    # Secure local storage
    flutter_secure_storage: ^10.0.0

      # Firebase
    firebase_core: ^4.5.0
    firebase_auth: ^6.2.0
    cloud_firestore: ^6.1.3
    firebase_app_check: ^0.4.1+5

    # State management
    flutter_riverpod: ^2.5.1

    # Progress & UI
    percent_indicator: ^4.2.3
    shimmer: ^3.0.0

    # Media saving / export to gallery
    gal: ^2.3.0
    open_filex: ^4.6.0

    # Path helpers
    path_provider: ^2.1.3
    path: ^1.9.0

    # UUID
    uuid: ^4.4.0

    # HTTP for Groq API calls
    dio: ^5.4.3+1

    # Color picker
    flutter_colorpicker: ^1.1.0

    # Google Sign-In
    google_sign_in: ^7.2.0

    # Google Fonts
    google_fonts: ^8.0.2

    # Crypto for device fingerprint hashing
    crypto: ^3.0.3

  dev_dependencies:
    flutter_test:
      sdk: flutter
    flutter_lints: ^6.0.0

  flutter:
    uses-material-design: true
    assets:
      - .env
